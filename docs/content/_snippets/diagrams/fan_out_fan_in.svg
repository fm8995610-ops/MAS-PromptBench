chor="middle">subtask 3</text><path class="edge" d="M358.0 205.0 L396.3 136.5"/><path class="head" d="M400.0 130.0 L392.7 134.5 L399.9 138.6Z"/><rect class="node-strong" x="402.0" y="103.0" width="110" height="54" rx="12"/><text class="t-on" x="457.0" y="128.0" text-anchor="middle">Coordinator</text><text class="t-small t-on" x="457.0" y="143.0" text-anchor="middle">synthesizes</text><path class="edge-io" d="M512.0 130.0 L534.0 130.0"/><path class="head-io" d="M540.0 130.0 L534.0 126.7 L534.0 133.3Z"/><rect class="io" x="542.0" y="113.0" width="64" height="34" rx="17"/><text x="574.0" y="134.5" text-anchor="middle">Answer</text><text class="t-small" x="158" y="92" text-anchor="middle">3 subtasks (JSON)</text><text class="t-small" x="457" y="92" text-anchor="middle">reports</text><text class="t-small" x="310" y="256" text-anchor="middle">The coordinator plans once and synthesizes · workers share one prompt and never see each other</text></svg></div>
