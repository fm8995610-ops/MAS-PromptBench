<div class="diagram-wrap"><svg class="topo-diagram" style="--tc: var(--t-iterative_refinement)" viewBox="0 18 620 274" role="img" aria-label="Iterative Refinement topology: a generator writes a candidate, two critics review it in parallel, and a verifier accepts it or sends feedback back to the generator, for at most three rounds." xmlns="http://www.w3.org/2000/svg"><rect class="io" x="11.0" y="103.0" width="70" height="34" rx="17"/><text x="46.0" y="124.5" text-anchor="middle">Task</text><path class="edge-io" d="M81.0 120.0 L95.0 120.0"/><path class="head-io" d="M101.0 120.0 L95.0 116.7 L95.0 123.3Z"/><rect class="node-strong" x="103.0" y="93.0" width="110" height="54" rx="12"/><text class="t-on" x="158.0" y="118.0" text-anchor="middle">Generator</text><text class="t-small t-on" x="158.0" y="133.0" text-anchor="middle">writes, revises</text><path class="edge" d="M213.0 105.0 L256.6 63.2"/><path class="head" d="M262.0 58.0 L253.7 60.2 L259.4 66.2Z"/><rect class="node" x="262.0" y="29.0" width="96" height="42" rx="12"/><text x="310.0" y="48.0" text-anchor="middle">Critic 1</text><text class="t-small" x="310.0" y="63.0" text-anchor="middle">correctness</text><path class="edge" d="M358.0 58.0 L404.5 100.9"/><path class="head" d="M410.0 106.0 L407.3 97.9 L401.7 103.9Z"/><path class="edge" d="M213.0 135.0 L256.6 176.8"/><path class="head" d="M262.0 182.0 L259.4 173.8 L253.7 179.8Z"/><rect class="node" x="262.0" y="169.0" width="96" height="42" rx="12"/><text x="310.0" y="188.0" text-anchor="middle">Critic 2</text><text class="t-small" x="310.0" y="203.0" text-anchor="middle">edge cases</text><path class="edge" d="M358.0 182.0 L404.5 139.1"/><path class="head" d="M410.0 134.0 L401.7 136.1 L407.3 142.1Z"/><path class="edge-soft" d="M213.0 120.0 L402.0 120.0"/><path class="head" d="M408.0 120.0 L402.0 116.7 L402.0 123.3Z"/><rect class="node" x="410.0" y="95.0" width="96" height="50" rx="12"/><text x="458.0" y="118.0" text-anchor="middle">Verifier</text><text class="t-small" x="458.0" y="133.0" text-anchor="middle">passed?</text><path class="edge-io" d="M506.0 120.0 L534.0 120.0"/><path class="head-io" d="M540.0 120.0 L534.0 116.7 L534.0 123.3Z"/><rect class="io" x="542.0" y="103.0" width="64" height="34" rx="17"/><text x="574.0" y="124.5" text-anchor="middle">Answer</text><text class="t-small" x="523" y="104" text-anchor="middle">pass</text><text class="t-small" x="310" y="114" text-anchor="middle">candidate</text><path class="edge-soft" d="M458 145 C458 262, 158 262, 158 155"/><path class="head" d="M158 147 L154 155 L162 155Z" opacity=".6"/><text class="t-small" x="310" y="252" text-anchor="middle">fail: feedback from the verifier and both critics</text><text class="t-small" x="310" y="280" text-anchor="middle">At most 3 rounds · critics and verifier never edit · the answer is the latest candidate</text></svg></div>
